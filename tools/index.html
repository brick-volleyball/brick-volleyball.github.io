<!-- ============================================================
     BRICK ツール 入口ページ
     最終更新日時: 2026-08-22 08:00 JST
     ------------------------------------------------------------
     Googleログイン → Firebase認証 → Firestoreでサポーター登録状況を確認
     → 登録中ならツール一覧へ、未登録ならStripe決済（サポーター登録）へ誘導

     2026-08-22: 表現を「契約／お支払い」から「サポーター登録／サポーターになる」へ変更。
     文言のみの変更で、判定ロジック(Firestoreのstatus/currentPeriodEnd)は不変。

     2026-08-22: 以下3点を追加修正。
     ・ロゴ下の見出しを「TOOLS」→「SUPPORTERS」に変更
     ・サポーター登録が確認できた場合、ボタンを押さなくても自動でlist.htmlへ遷移
     ・ページを開いた時点で既にFirebaseへログイン済みなら、Googleログインボタンを
       押し直さなくても自動的に契約確認へ進むように変更(onAuthStateChangedを追加)。
       Firebase Authのログイン状態はブラウザに既定で保持されるため、明示的な
       ログアウト操作をしない限り再訪問時もログイン状態が維持される
     ============================================================ -->

<style>
  :root{
    --navy:#182338;
    --navy-deep:#0D141F;
    --turquoise:#4FC3D9;
    --turquoise-deep:#2FA0B8;
    --white:#FFFFFF;
    --paper:#F7F5F1;
    --orange:#E8703A;
    --orange-deep:#C85A2A;
    --yellow:#FFC857;
    --line: rgba(24,35,56,0.14);
    --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Noto Sans JP", sans-serif;
    --font-body: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    --font-score: "Roboto Condensed", "Zen Kaku Gothic New", sans-serif;
  }

  @import url('https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Roboto+Condensed:wght@700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap');

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family: var(--font-body);
    background: var(--navy);
    color: #fff;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    position: relative;
    overflow: hidden;
  }

  .bg-grid{
    position: absolute;
    inset: 0;
    background-image:
      repeating-linear-gradient(0deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 46px),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0 1px, transparent 1px 46px);
    mask-image: radial-gradient(ellipse at 50% 30%, black 0%, transparent 70%);
    pointer-events: none;
  }

  .card{
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 20px;
    padding: 44px 36px;
    text-align: center;
    backdrop-filter: blur(6px);
  }

  .logo{
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 24px;
    letter-spacing: -0.02em;
    margin-bottom: 6px;
  }
  .logo .l-b{ color: #4285F4; }
  .logo .l-r{ color: #EA4335; }
  .logo .l-i{ color: #FBBC05; }
  .logo .l-c{ color: #4285F4; }
  .logo .l-k{ color: #34A853; }

  .eyebrow{
    font-family: var(--font-score);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--turquoise);
    margin-bottom: 28px;
  }

  h1{
    font-family: var(--font-display);
    font-weight: 900;
    font-size: 22px;
    line-height: 1.4;
    margin-bottom: 12px;
  }

  .sub{
    font-size: 13.5px;
    line-height: 1.8;
    color: rgba(255,255,255,0.65);
    margin-bottom: 32px;
  }

  #google-signin-btn{
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  .status{
    min-height: 24px;
    font-size: 13px;
    color: rgba(255,255,255,0.55);
    margin-top: 8px;
  }
  .status.error{ color: #FF8C7A; }

  /* トスの軌道アニメーション（読み込み中の演出） */
  .toss-loader{
    display: none;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 8px;
  }
  .toss-loader.active{ display: flex; }
  .toss-ball{
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--turquoise);
    animation: toss 1.2s ease-in-out infinite;
  }
  .toss-ball:nth-child(2){ animation-delay: 0.15s; }
  .toss-ball:nth-child(3){ animation-delay: 0.3s; }
  @keyframes toss{
    0%, 100%{ transform: translateY(0); opacity: 0.5; }
    50%{ transform: translateY(-10px); opacity: 1; }
  }

  .result-box{
    display: none;
    margin-top: 8px;
    padding: 20px;
    border-radius: 14px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.14);
  }
  .result-box.active{ display: block; }
  .result-box p{
    font-size: 13.5px;
    line-height: 1.8;
    color: rgba(255,255,255,0.8);
    margin-bottom: 16px;
  }

  .btn{
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px 26px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 14px;
    border: none;
    cursor: pointer;
    text-decoration: none;
    width: 100%;
    transition: transform .2s ease, background .2s ease;
  }
  .btn-primary{
    background: var(--turquoise);
    color: var(--navy-deep);
  }
  .btn-primary:hover{ transform: translateY(-2px); background: var(--turquoise-deep); color: #fff; }
  .btn-pay{
    background: var(--orange);
    color: #fff;
  }
  .btn-pay:hover{ transform: translateY(-2px); background: var(--orange-deep); }

  .footer-note{
    margin-top: 28px;
    font-size: 11.5px;
    color: rgba(255,255,255,0.35);
    line-height: 1.7;
  }
  .footer-note a{ color: rgba(255,255,255,0.5); }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="bg-grid"></div>

<div class="card">
  <div class="logo">
    <span class="l-b">B</span><span class="l-r">R</span><span class="l-i">I</span><span class="l-c">C</span><span class="l-k">K</span>
  </div>
  <div class="eyebrow">SUPPORTERS</div>

  <h1>BRICKサポーターとしてログイン</h1>
  <p class="sub">Googleアカウントでログインすると、サポーター登録状況を確認してツール一覧へご案内します。</p>

  <div id="google-signin-btn"></div>

  <div class="toss-loader" id="toss-loader">
    <div class="toss-ball"></div>
    <div class="toss-ball"></div>
    <div class="toss-ball"></div>
  </div>

  <p class="status" id="status-text"></p>

  <div class="result-box" id="result-active">
    <p id="active-message">サポーター登録が確認できました。ツール一覧へどうぞ。</p>
    <a href="./list.html" class="btn btn-primary">ツール一覧へ進む</a>
  </div>

  <div class="result-box" id="result-inactive">
    <p id="inactive-message">現在、サポーター登録が確認できませんでした。BRICKサポーターになると、これらのツールをご利用いただけます。</p>
    <a href="https://buy.stripe.com/5kQ14f75z1tG1Ungkt4ZG01" class="btn btn-pay" target="_blank" rel="noopener">サポーターになる</a>
  </div>

  <p class="footer-note">
    ログインすると、サポーター登録確認のためメールアドレスを利用します。<br>
    お困りの場合は <a href="mailto:brick.volley@gmail.com">brick.volley@gmail.com</a> までご連絡ください。
  </p>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, GoogleAuthProvider, signInWithCredential, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---- Firebase設定 ----
  const firebaseConfig = {
    apiKey: "AIzaSyCn0rLPeyN_hw3_lLaYw1UMAzsSK3DpxuM",
    authDomain: "team-video-uploader-503720.firebaseapp.com",
    projectId: "team-video-uploader-503720",
    storageBucket: "team-video-uploader-503720.firebasestorage.app",
    messagingSenderId: "551674365524",
    appId: "1:551674365524:web:f67d5524bc0b3ccec70fc1",
    measurementId: "G-S97JSJJC1N"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const GOOGLE_CLIENT_ID = "551674365524-1qjh7ij42vd933gdns994gqckuglcmqb.apps.googleusercontent.com";

  const statusText = document.getElementById('status-text');
  const tossLoader = document.getElementById('toss-loader');
  const resultActive = document.getElementById('result-active');
  const resultInactive = document.getElementById('result-inactive');

  function showLoading(msg){
    statusText.textContent = msg || '確認しています…';
    statusText.classList.remove('error');
    tossLoader.classList.add('active');
    resultActive.classList.remove('active');
    resultInactive.classList.remove('active');
  }

  function showError(msg){
    statusText.textContent = msg;
    statusText.classList.add('error');
    tossLoader.classList.remove('active');
  }

  function showActive(){
    tossLoader.classList.remove('active');
    statusText.textContent = '';
    resultActive.classList.add('active');
    // メッセージを一瞬見せてから、ボタン操作なしで自動的にツール一覧へ遷移
    setTimeout(() => {
      window.location.href = './list.html';
    }, 900);
  }

  function showInactive(){
    tossLoader.classList.remove('active');
    statusText.textContent = '';
    resultInactive.classList.add('active');
  }

  // ---- Firestoreでサポーター登録状況を確認し、結果に応じて画面を出し分ける ----
  // Googleログインボタンからの新規ログイン時と、再訪問時の自動ログイン確認の
  // どちらからも呼び出す共通処理
  async function checkSubscriptionAndProceed(email){
    try{
      console.log('[BRICK DEBUG] 契約確認対象メールアドレス:', JSON.stringify(email));

      // Firestoreの subscriptions コレクションを、メールアドレスをドキュメントIDとして確認
      const subRef = doc(db, 'subscriptions', email);
      const subSnap = await getDoc(subRef);

      console.log('[BRICK DEBUG] subSnap.exists():', subSnap.exists());

      if (subSnap.exists()){
        const data = subSnap.data();
        console.log('[BRICK DEBUG] 取得したデータ:', JSON.stringify(data));
        const isActive = data.status === 'active';
        // 有効期限があれば、期限内かどうかもチェック（任意項目）
        const notExpired = !data.currentPeriodEnd || (new Date(data.currentPeriodEnd.toDate ? data.currentPeriodEnd.toDate() : data.currentPeriodEnd) > new Date());
        console.log('[BRICK DEBUG] isActive:', isActive, 'notExpired:', notExpired);

        if (isActive && notExpired){
          // 短い有効期限つきトークンをセッションに保存（ツール一覧ページでの確認用）
          sessionStorage.setItem('brick_tools_email', email);
          sessionStorage.setItem('brick_tools_verified_at', Date.now().toString());
          showActive();
          return;
        }
      }

      showInactive();

    } catch(err){
      console.error('[BRICK DEBUG] エラー詳細:', err.code, err.message, err);
      showError('エラーが発生しました。時間をおいて再度お試しください。');
    }
  }

  // ---- Googleログイン成功時のコールバック ----
  window.handleGoogleSignIn = async function(response){
    try{
      showLoading('ログインしています…');

      // GoogleのIDトークンをFirebaseの認証情報に変換
      const credential = GoogleAuthProvider.credential(response.credential);
      const userCred = await signInWithCredential(auth, credential);
      const email = userCred.user.email;

      showLoading('サポーター登録状況を確認しています…');
      console.log('[BRICK DEBUG] ログイン成功、メールアドレス:', JSON.stringify(email));

      await checkSubscriptionAndProceed(email);

    } catch(err){
      console.error('[BRICK DEBUG] エラー詳細:', err.code, err.message, err);
      showError('エラーが発生しました。時間をおいて再度お試しください。');
    }
  };

  // ---- ページを開いた時点で既にログイン済みなら、ボタン操作なしで自動確認 ----
  // Firebase Authのログイン状態は既定でブラウザに保持されるため、明示的に
  // ログアウトしない限り、再訪問時もこの処理だけでツール一覧まで自動的に進む
  onAuthStateChanged(auth, async (user) => {
    if (!user || !user.email) return; // 未ログインならGoogleボタンの操作を待つ
    showLoading('サポーター登録状況を確認しています…');
    await checkSubscriptionAndProceed(user.email);
  });
</script>

<!-- Google Identity Services -->
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
  window.onload = function(){
    google.accounts.id.initialize({
      client_id: "551674365524-1qjh7ij42vd933gdns994gqckuglcmqb.apps.googleusercontent.com",
      callback: handleGoogleSignIn
    });
    google.accounts.id.renderButton(
      document.getElementById('google-signin-btn'),
      { theme: 'filled_black', size: 'large', shape: 'pill', text: 'signin_with', width: 280 }
    );
  };
</script>
